name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  watcher-core-test:
    name: watcher-core-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.12.2"
          cabal-version: "3.14.2.0"

      - name: Update package index
        run: cabal update

      - name: Run tests
        run: cabal test watcher-core-test
